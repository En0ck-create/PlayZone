<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Play Game - PlayZone</title>
<style>body{margin:0;background:#0d1117;color:#fff;font-family:Arial,sans-serif;text-align:center}header{padding:18px;background:#151b24;text-align:left}a{color:#66e3ff;text-decoration:none}.game{width:min(700px,92%);margin:40px auto;background:#151b24;padding:30px;border-radius:15px}.area{height:280px;border:2px solid #273142;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column}.btn{padding:12px 20px;border:0;border-radius:8px;background:#66e3ff;font-weight:bold;cursor:pointer}</style></head>
<body><header><a href="index.html">← Back to PlayZone</a></header><main class="game"><h1 id="title">Game</h1><div class="area"><p id="text">Choose a game.</p><button class="btn" id="action">START</button></div></main>
<script>const g=new URLSearchParams(location.search).get('game');const t=document.querySelector('#title'),x=document.querySelector('#text'),b=document.querySelector('#action');if(g==='coin'){t.textContent='🪙 Coin Clicker';x.textContent='Coins: 0';let n=0;b.onclick=()=>{n++;x.textContent='Coins: '+n}}else if(g==='number'){t.textContent='🔢 Number Guess';const secret=Math.floor(Math.random()*10)+1;b.onclick=()=>{const a=prompt('Guess a number from 1 to 10');if(Number(a)===secret)x.textContent='Correct! 🎉';else x.textContent='Not quite. Try again!'}}else if(g==='rocket'){t.textContent='🚀 Rocket Dodge';x.textContent='Press START to begin your demo.';b.onclick=()=>x.textContent='🚀 You survived the first obstacle!'}else{x.textContent='Game not found.'}</script>
</body></html>

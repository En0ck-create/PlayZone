<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Game - PlayZone</title>

<style>
body{
  margin:0;
  background:#0d1117;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:18px 7%;
  background:#151b24;
}

a{
  color:#66e3ff;
  text-decoration:none;
}

.box{
  width:min(650px,90%);
  margin:45px auto;
  background:#151b24;
  padding:28px;
  border-radius:15px;
  border:1px solid #273142;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #374151;
  background:#0d1117;
  color:#fff;
  box-sizing:border-box;
}

textarea{
  min-height:110px;
}

button{
  margin-top:20px;
  padding:12px 20px;
  border:0;
  border-radius:8px;
  background:#66e3ff;
  font-weight:bold;
  cursor:pointer;
}

.note{
  color:#aeb7c6;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← PlayZone</a>
</header>

<main class="box">

<h1>Submit Your Game</h1>

<p class="note">
Your game will be submitted for review. It will not appear publicly until it is approved.
</p>

<form id="form">

<label>Game name</label>
<input required id="name">

<label>Developer name</label>
<input required id="dev">

<label>Category</label>
<select id="cat">
  <option>Action</option>
  <option>Arcade</option>
  <option>Puzzle</option>
  <option>Other</option>
</select>

<label>Game URL</label>
<input required type="url" id="url" placeholder="https://example.com/game">

<label>Thumbnail URL</label>
<input type="url" id="thumb" placeholder="https://example.com/image.jpg">

<label>Description</label>
<textarea required id="desc"></textarea>

<button type="submit">Submit Game</button>

</form>

<p id="msg" class="note"></p>

</main>

<script>

const SUPABASE_URL = 'https://eichffccmqnoqbssrnjb.supabase.co';

const SUPABASE_KEY = 'sb_publishable_Y3NMS5Ru6nXHA2R4hkjKlg_0bWxnDRT';

document.querySelector('#form').addEventListener('submit', async e => {

  e.preventDefault();

  const msg = document.querySelector('#msg');
  const button = e.target.querySelector('button');

  button.disabled = true;
  button.textContent = 'Submitting...';
  msg.textContent = '';

  const game = {
    game_name: document.querySelector('#name').value.trim(),
    developer_name: document.querySelector('#dev').value.trim(),
    category: document.querySelector('#cat').value,
    game_url: document.querySelector('#url').value.trim(),
    thumbnail_url: document.querySelector('#thumb').value.trim(),
    description: document.querySelector('#desc').value.trim(),
    status: 'pending'
  };

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/games`,
      {
        method: 'POST',

        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },

        body: JSON.stringify(game)
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText || 'Submission failed.');
    }

    msg.textContent =
      'Game submitted successfully! It is now waiting for admin approval.';

    e.target.reset();

  } catch (error) {

    console.error(error);

    msg.textContent =
      'Sorry, the submission failed. Please try again.';

  } finally {

    button.disabled = false;
    button.textContent = 'Submit Game';

  }

});

</script>

</body>
</html>
